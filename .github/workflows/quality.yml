name: AETHER quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check application JavaScript
        run: node --check assets/js/aether.js
      - name: Verify required application assets
        run: |
          test -s index.html
          test -s assets/css/aether.css
          test -s assets/js/aether.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s docs/ORGANIZATION.md