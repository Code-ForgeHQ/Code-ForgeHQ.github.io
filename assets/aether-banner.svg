<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">AETHER — Digital Operating Environment</title>
<desc id="desc">A dark monochrome animated orbital field with the AETHER wordmark and Code Forge attribution.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset=".52" stop-color="#07090c"/><stop offset="1" stop-color="#030405"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#e9f1f9" stop-opacity=".2"/><stop offset="1" stop-color="#e9f1f9" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
<circle cx="930" cy="160" r="170" fill="url(#halo)" opacity=".7"/>
<g fill="#fff" opacity=".6">
  <circle cx="90" cy="55" r="1.2"><animate attributeName="opacity" values=".15;.9;.15" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="245" cy="240" r="1.5"><animate attributeName="opacity" values=".2;.85;.2" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="410" cy="72" r="1"><animate attributeName="opacity" values=".1;.8;.1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="260" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="58" r="1.2"><animate attributeName="opacity" values=".1;.8;.1" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="240" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.4s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(930 160)" fill="none" stroke="#e8eef5">
  <circle r="82" stroke-opacity=".2"/>
  <ellipse rx="126" ry="48" stroke-opacity=".34" transform="rotate(-28)"/>
  <ellipse rx="110" ry="68" stroke-opacity=".22" transform="rotate(53)"/>
  <ellipse rx="74" ry="116" stroke-opacity=".15" transform="rotate(78)"/>
  <circle r="36" fill="#fff" fill-opacity=".045" stroke-opacity=".6"/>
  <path d="M-13 18 0-18 13 18M-8 3H8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="0" r="4" fill="#fff" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="-110" cy="0" r="3" fill="#fff" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/></circle>
</g>
<path d="M70 244H610" stroke="#dbe5ef" stroke-opacity=".18"/>
<text x="70" y="151" fill="#f5f7fa" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="13">AETHER</text>
<text x="75" y="190" fill="#aab5c0" font-family="Inter,Arial,sans-serif" font-size="16" letter-spacing="5">DIGITAL OPERATING ENVIRONMENT</text>
<text x="75" y="278" fill="#7d8995" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="3">CODE FORGE  /  LOCAL-FIRST  /  CROSS-PLATFORM</text>
</svg>